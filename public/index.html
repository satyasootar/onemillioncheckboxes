<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Million Checkboxes</title>
    <meta name="description" content="A real-time collaborative canvas of checkboxes.">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-bar" id="auth-bar">
        <div id="logged-out-view">
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn">Login</button>
            <button id="register-btn">Register</button>
        </div>
        <div id="logged-in-view" style="display: none;">
            <span class="welcome-text">Logged in as <strong id="current-user"></strong></span>
            <button id="logout-btn">Logout</button>
        </div>
    </div>

    <div class="page-layout">
        <aside class="live-feed">
            <div class="feed-header">
                <h3>Live Activity</h3>
            </div>
            <ul id="feed-list" class="feed-list">
                <li class="feed-placeholder">Waiting for activity...</li>
            </ul>
        </aside>

        <main class="main-container">
            <div class="cluster-wrapper">
                <div class="cluster-header">
                    <h1>Million Checkboxes</h1>
                </div>
                <div id="checkbox-container"></div>
            </div>
        </main>
    </div>

    <div id="custom-tooltip" class="custom-tooltip"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
