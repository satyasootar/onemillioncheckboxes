version: '3.8'

services:
  app:
    build: .
    container_name: 1m-checkboxes-app
    restart: unless-stopped
    ports:
      - "3015:3000"
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=checkboxes
      - JWT_SECRET=supersecret123
      - PORT=3000
    depends_on:
      - valkey
      - db
    networks:
      - checkbox-network

  valkey:
    image: valkey/valkey:latest
    container_name: 1m-checkboxes-valkey
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - checkbox-network

  db:
    image: postgres:15-alpine
    container_name: 1m-checkboxes-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=checkboxes
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - checkbox-network

networks:
  checkbox-network:
    driver: bridge

volumes:
  valkey-data:
  pg-data: